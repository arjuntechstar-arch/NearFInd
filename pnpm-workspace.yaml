packages:
  - apps/*
  - packages/*

# Supply-chain controls. Direct dependencies are reviewed in PRs; transitive
# dependencies may only resolve from trusted registry sources.
blockExoticSubdeps: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Reviewed framework releases newer than the 7-day quarantine window.
  - next@16.4.0
  - '@next/env@16.4.0'
  - '@next/swc-*'
  - expo@57.0.21
  - 'expo-*'
trustPolicy: no-downgrade
trustPolicyExclude:
  # Legacy transitive dependency pulled by Jest/Babel. Exact-version exception;
  # do not widen this without reviewing provenance and the dependency path.
  - semver@6.3.1
  # Exact Expo SDK 57 authentication dependency chain reviewed against the
  # official Expo npm packages and github.com/expo/expo after pnpm alerts.
  - expo-auth-session@57.0.14
  - expo-application@57.0.3
  - expo-constants@57.0.21
  - expo-crypto@57.0.3
  - expo-linking@57.0.12
  - expo-secure-store@57.0.4
  - expo-web-browser@57.0.3

# pnpm 11+ build-script policy. Keep this explicit: native watcher/resolver
# packages and esbuild are required by our toolchain, while Scarf is
# telemetry-only and must never execute during dependency installation.
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  esbuild: true
  unrs-resolver: true
