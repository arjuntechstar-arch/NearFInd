packages:
  - apps/*
  - packages/*

# Supply-chain controls. Direct dependencies are reviewed in PRs; transitive
# dependencies may only resolve from trusted registry sources.
blockExoticSubdeps: true
minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyExclude:
  # Legacy transitive dependency pulled by Jest/Babel. Exact-version exception;
  # do not widen this without reviewing provenance and the dependency path.
  - semver@6.3.1
