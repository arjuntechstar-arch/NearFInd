services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: nearfind
      POSTGRES_USER: nearfind
      POSTGRES_PASSWORD: nearfind_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nearfind -d nearfind"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - nearfind-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - nearfind-redis:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nearfind
      MINIO_ROOT_PASSWORD: nearfind-local-change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - nearfind-minio:/data

volumes:
  nearfind-postgres:
  nearfind-redis:
  nearfind-minio:
