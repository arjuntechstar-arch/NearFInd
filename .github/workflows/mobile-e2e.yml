name: Mobile E2E
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 2,5'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: { version: 12.11.2 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - run: pnpm install --frozen-lockfile
      # Configure Android emulator + Maestro/Detox when Phase 1 native E2E lands.
      - name: Android E2E
        shell: pwsh
        run: ./scripts/testing/Test-Mobile.ps1 -E2E Android

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: { version: 12.11.2 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - name: iOS E2E
        shell: pwsh
        run: ./scripts/testing/Test-Mobile.ps1 -E2E iOS
