name: Mobile E2E
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 2,5'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Configure Android emulator + Maestro/Detox in the generated repository.
      - name: Android E2E
        shell: pwsh
        run: ./scripts/testing/Test-Mobile.ps1 -E2E Android

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: iOS E2E
        shell: pwsh
        run: ./scripts/testing/Test-Mobile.ps1 -E2E iOS
