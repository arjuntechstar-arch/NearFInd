name: Phase 2 client auth dependency refresh

on:
  push:
    branches:
      - feature/phase-2-client-auth-saved
    paths:
      - .github/workflows/phase2-client-auth-deps.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-2-client-auth-saved
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.11.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install SDK-compatible auth dependencies
        run: pnpm --filter @nearfind/mobile exec expo install expo-auth-session expo-crypto expo-secure-store expo-web-browser
      - name: Commit dependency updates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/mobile/package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git commit -m "chore(mobile): add SDK-compatible auth dependencies"
          git push origin HEAD:feature/phase-2-client-auth-saved
